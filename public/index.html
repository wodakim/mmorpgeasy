<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aestheria</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.150.1/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <!-- Main Menu Overlay -->
    <div id="main-menu">
        <div id="menu-content">
            <h1>AESTHERIA</h1>

            <!-- Login Form -->
            <div id="login-form">
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <div class="menu-buttons">
                    <button id="btn-login">Login</button>
                    <button id="btn-register">Register</button>
                </div>
                <div id="login-msg"></div>
            </div>

            <!-- Character Creation -->
            <div id="create-char-form" style="display: none;">
                <h2>Create Hero</h2>
                <div id="class-selection">
                    <div class="class-card" data-class="Guerrier" style="border-color: #A52A2A;">
                        <h3>Guerrier</h3>
                        <p>Tanky & Strong</p>
                    </div>
                    <div class="class-card" data-class="Ranger" style="border-color: #228B22;">
                        <h3>Ranger</h3>
                        <p>Fast & Agile</p>
                    </div>
                    <div class="class-card" data-class="Mage" style="border-color: #4169E1;">
                        <h3>Mage</h3>
                        <p>High Mana</p>
                    </div>
                </div>
                <input type="color" id="char-color" value="#ffffff">
                <input type="text" id="char-name" placeholder="Hero Name">
                <button id="btn-create">Create Character</button>
            </div>

            <!-- Lobby -->
            <div id="lobby-screen" style="display: none;">
                <h2 id="welcome-text">Welcome back</h2>
                <button id="btn-play">ENTER WORLD</button>
            </div>
        </div>
    </div>

    <div id="ui-layer" style="display: none;">
        <!-- Top Left: Stats -->
        <div id="stats-container">
            <div class="stat-bar-wrapper">
                <div id="hp-bar" class="stat-bar"></div>
            </div>
            <div class="stat-bar-wrapper">
                <div id="mana-bar" class="stat-bar"></div>
            </div>
            <div class="stat-bar-wrapper" style="height: 6px; margin-top: 4px;">
                <div id="xp-bar" class="stat-bar"></div>
            </div>
        </div>

        <!-- Floating Text Container -->
        <div id="floating-text-container"></div>

        <!-- Top Right: Minimap -->
        <div id="minimap-container">
            <div id="minimap-player"></div>
        </div>

        <!-- Bottom Left: Chat -->
        <div id="chat-container">
            <div id="chat-log"></div>
            <input type="text" id="chat-input" placeholder="Press Enter to chat..." autocomplete="off">
        </div>

        <!-- Bottom Center: Action Bar -->
        <div id="action-bar-container">
            <div class="action-slot" data-key="1"><span class="key-hint">1</span></div>
            <div class="action-slot" data-key="2">
                <span class="key-hint">2</span>
                <div class="cooldown-overlay" id="cd-2"></div>
            </div>
            <div class="action-slot" data-key="3"><span class="key-hint">3</span></div>
            <div class="action-slot" data-key="4"><span class="key-hint">4</span></div>
            <div class="action-slot" data-key="5"><span class="key-hint">5</span></div>
        </div>

        <!-- Touch Controls -->
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
        <div id="skill-button">⚡</div>
        <div id="action-button">⚔️</div>

        <!-- Death Screen -->
        <div id="death-screen">VOUS ÊTES MORT</div>
    </div>
    <script src="client.js"></script>
</body>
</html>
